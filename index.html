<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Trắc nghiệm Lịch sử Đảng</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        <style>
            /* Di chuột vào hiện màu xanh biển nhẹ */
            .answer-btn:not(:disabled):hover {
                border-color: #93c5fd !important;
                background-color: #eff6ff !important;
            }
            /* Đáp án đúng hiện màu xanh lá */
            .answer-btn.correct-highlight {
                border-color: #22c55e !important;
                background-color: #f0fdf4 !important;
                color: #15803d !important;
                font-weight: 600 !important;
            }
            /* Câu chọn sai hiện màu đỏ */
            .answer-btn.user-wrong {
                border-color: #ef4444 !important;
                background-color: #fef2f2 !important;
                color: #b91c1c !important;
                font-weight: 600 !important;
            }
            /* Các câu còn lại mờ đi */
            .answer-btn.other-options {
                border-color: #e2e8f0 !important;
                background-color: #f8fafc !important;
                color: #94a3b8 !important;
            }
        </style>
    </head>
    <body class="bg-slate-100 flex items-center justify-center min-h-screen p-4 font-sans text-slate-800">
        <!-- Thẻ giao diện chính giống ảnh mẫu -->
        <main
            class="w-full max-w-2xl bg-white rounded-3xl shadow-sm border border-slate-100 p-6 sm:p-10 transition-all"
        >
            <!-- Thanh điều khiển trên cùng -->
            <header class="flex items-center justify-between pb-4 border-b border-slate-100 mb-5">
                <div class="flex items-center gap-2">
                    <h1 class="text-base sm:text-lg font-bold text-slate-800" id="quizTitle">
                        Trắc nghiệm Lịch sử Đảng
                    </h1>
                    <button
                        onclick="toggleConfigModal()"
                        title="Nhấn để chọn số câu hoặc xáo trộn đề"
                        class="relative text-xs font-bold px-3 py-1.5 bg-blue-50 text-blue-600 border border-blue-200 hover:bg-blue-600 hover:text-white rounded-xl shadow-sm transition-all duration-200 flex items-center gap-1.5 group cursor-pointer"
                    >
                        <!-- Dấu chấm thông báo màu đỏ nhấp nháy để kéo ánh nhìn -->
                        <span class="absolute -top-1 -right-1 flex h-2.5 w-2.5">
                            <span
                                class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"
                            ></span>
                            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500"></span>
                        </span>

                        <i class="fa-solid fa-sliders text-blue-500 group-hover:text-white transition"></i>
                        <span>Tùy chỉnh đề thi</span>
                    </button>
                </div>

                <button
                    onclick="resetAndRestart()"
                    title="Làm lại từ đầu"
                    class="text-slate-400 hover:text-slate-600 transition text-sm p-1"
                >
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </header>

            <!-- Thanh tiến trình và bộ đếm đúng / sai -->
            <section class="flex items-center gap-3 mb-6">
                <div class="flex-1 bg-slate-100 h-2 rounded-full overflow-hidden">
                    <div
                        id="progressBar"
                        class="bg-slate-800 h-full rounded-full transition-all duration-300"
                        style="width: 0%"
                    ></div>
                </div>
                <div class="text-xs font-semibold text-slate-400 whitespace-nowrap" id="progressText">1 / 150</div>

                <!-- Thống kê đúng sai dạng thẻ nhỏ -->
                <div class="flex items-center gap-1.5 ml-2 text-xs font-bold">
                    <span class="px-2 py-0.5 rounded-md bg-rose-50 text-rose-500 border border-rose-100" id="wrongBadge"
                        >✕ 0</span
                    >
                    <span
                        class="px-2 py-0.5 rounded-md bg-emerald-50 text-emerald-600 border border-emerald-100"
                        id="correctBadge"
                        >✓ 0</span
                    >
                </div>
            </section>

            <!-- Khu vực hiển thị câu hỏi -->
            <article id="questionSection">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2" id="questionIndexLabel">
                    CÂU HỎI 1
                </p>
                <h2 class="text-base sm:text-lg font-bold text-slate-800 leading-snug mb-6" id="questionContent">
                    Đang chuẩn bị dữ liệu câu hỏi...
                </h2>

                <!-- Danh sách lựa chọn A, B, C, D -->
                <div class="flex flex-col gap-3 mb-8" id="answersContainer">
                    <!-- Phương án được render tự động -->
                </div>
            </article>

            <!-- Nút điều hướng chân thẻ -->
            <footer class="flex items-center justify-between pt-2">
                <button
                    id="prevBtn"
                    onclick="prevQuestion()"
                    class="px-5 py-2.5 rounded-xl font-semibold text-sm text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition disabled:opacity-40 disabled:hover:bg-transparent"
                >
                    Quay lại
                </button>

                <button
                    id="nextBtn"
                    onclick="nextQuestion()"
                    class="px-6 py-2.5 rounded-xl font-semibold text-sm bg-blue-600 hover:bg-blue-700 text-white shadow-sm shadow-blue-200 transition"
                >
                    Tiếp tục
                </button>
            </footer>
        </main>

        <!-- Hộp thoại cài đặt dải câu & xáo trộn -->
        <dialog
            id="configModal"
            class="rounded-2xl p-6 bg-white shadow-xl border border-slate-200 max-w-sm w-full backdrop:bg-black/30"
        >
            <h3 class="font-bold text-base text-slate-800 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-sliders text-blue-600"></i> Cấu hình luyện tập
            </h3>
            <form method="dialog" class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Từ câu:</label>
                        <input
                            type="number"
                            id="inputFrom"
                            value="1"
                            min="1"
                            max="150"
                            class="w-full border border-slate-200 rounded-lg px-3 py-1.5 text-sm outline-none focus:border-blue-500"
                        />
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Đến câu:</label>
                        <input
                            type="number"
                            id="inputTo"
                            value="150"
                            min="1"
                            max="150"
                            class="w-full border border-slate-200 rounded-lg px-3 py-1.5 text-sm outline-none focus:border-blue-500"
                        />
                    </div>
                </div>

                <div class="space-y-2 pt-2 border-t border-slate-100 text-sm">
                    <label class="flex items-center gap-2 text-slate-700 cursor-pointer">
                        <input type="checkbox" id="checkShuffleQ" class="rounded text-blue-600 focus:ring-blue-500" />
                        <span>Xáo trộn thứ tự các câu</span>
                    </label>
                    <label class="flex items-center gap-2 text-slate-700 cursor-pointer">
                        <input type="checkbox" id="checkShuffleA" class="rounded text-blue-600 focus:ring-blue-500" />
                        <span>Xáo trộn vị trí đáp án (A, B, C, D)</span>
                    </label>
                </div>

                <div class="flex justify-end gap-2 pt-4">
                    <button
                        type="button"
                        onclick="closeConfigModal()"
                        class="px-4 py-2 text-xs font-semibold text-slate-500 hover:bg-slate-100 rounded-lg"
                    >
                        Đóng
                    </button>
                    <button
                        type="button"
                        onclick="applySettings()"
                        class="px-4 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm"
                    >
                        Áp dụng
                    </button>
                </div>
            </form>
        </dialog>

        <script>
            // Ngân hàng 150 câu hỏi tóm tắt & chuẩn hóa từ nội dung tài liệu
            const fullQuestions = [
                {
                    id: 1,
                    q: "Thời gian thực dân Pháp tiến hành khai thác thuộc địa lần thứ nhất ở Việt Nam khi nào?",
                    a: ["1858-1884", "1884-1896", "1897-1914", "1914-1918"],
                    c: 2,
                },
                {
                    id: 2,
                    q: "Trong đợt khai thác thuộc địa lần thứ nhất của thực dân Pháp ở nước ta có giai cấp mới nào được hình thành?",
                    a: [
                        "Giai cấp tư sản",
                        "Giai cấp tư sản và công nhân",
                        "Giai cấp công nhân",
                        "Giai cấp tiểu tư sản",
                    ],
                    c: 2,
                },
                {
                    id: 3,
                    q: "Trước Chiến tranh thế giới thứ nhất, ở Việt Nam có những giai cấp nào?",
                    a: [
                        "Địa chủ phong kiến và nông dân",
                        "Địa chủ phong kiến, nông dân, tư sản, tiểu tư sản và công nhân",
                        "Địa chủ phong kiến, nông dân và công nhân",
                        "Địa chủ phong kiến, nông dân và tiểu tư sản",
                    ],
                    c: 2,
                },
                {
                    id: 4,
                    q: "Dưới chế độ thực dân phong kiến, giai cấp nông dân Việt Nam có yêu cầu bức thiết nhất là gì?",
                    a: ["Độc lập dân tộc", "Ruộng đất", "Quyền bình đẳng nam, nữ", "Được giảm tô, giảm tức"],
                    c: 1,
                },
                {
                    id: 5,
                    q: "Mâu thuẫn cơ bản và chủ yếu ở Việt Nam đầu thế kỷ XX là mâu thuẫn nào?",

                {
                    id: 6,
                    q: "Đặc điểm ra đời của giai cấp công nhân Việt Nam như thế nào?",
                    a: [
                        "Ra đời trước giai cấp tư sản, trong cuộc khai thác thuộc địa lần thứ nhất của thực dân Pháp.",
                        "Phần lớn xuất thân từ nông dân.",
                        "Chịu sự áp bức và bóc lột của đế quốc, phong kiến và tư sản",
                        "Cả a, b và c",
                    ],
                    c: 3,
                },
                {
                    id: 7,
                    q: "Những giai cấp bị trị ở Việt Nam dưới chế độ thuộc địa của đế quốc Pháp là:",
                    a: [
                        "Công nhân và nông dân",

                        "Công nhân, nông dân, tiểu tư sản, tư sản dân tộc, địa chủ vừa và nhỏ",
                    ],
                    c: 3,
                },
                {
                    id: 8,
                    q: "Khi nào phong trào công nhân Việt Nam hoàn toàn trở thành một phong trào tự giác?",
                    a: [
                        "Năm 1920 (tổ chức công hội ở Sài Gòn được thành lập)",
                        "Năm 1925 (cuộc bãi công Ba Son)",

                {

                    a: ["1917", "1918", "1919", "1920"],

                {
                    id: 10,
                    q: "Báo Đời sống công nhân là của tổ chức nào?",

                        "Đảng Xã hội Pháp",

                        "Hội Liên hiệp thuộc địa",

                {

                {
                    id: 13,
                    q: 'Sự kiện nào được Nguyễn ái Quốc đánh giá "như chim én nhỏ báo hiệu mùa Xuân"?',
                    a: [

                    c: 0,
                },
                {
                    id: 15,
                    q: "Cơ quan ngôn luận của Hội Việt Nam Cách mạng Thanh niên là tờ báo nào?",
                    a: ["Báo Thanh niên", "Báo Người cùng khổ", "Báo Đời sống công nhân", "Báo Tiếng dân"],
                    c: 0,
                },
                {
                    id: 16,
                    q: 'Hội Việt Nam Cách mạng Thanh niên thực hiện chủ trương "vô sản hoá" khi nào?',
                    a: [
                        "Cuối năm 1926 đầu năm 1927",
                        "Cuối năm 1927 đầu năm 1928",
                        "Cuối năm 1928 đầu năm 1929",
                        "Cuối năm 1929 đầu năm 1930",
                    ],
                    c: 2,
                },
                {
                    id: 17,
                    q: "Tên chính thức của tổ chức này được đặt tại Đại hội lần thứ nhất ở Quảng Châu (tháng 5-1929) là gì?",
                    a: [
                        "Việt Nam Thanh niên cách mạng đồng chí Hội",
                        "Hội Việt Nam cách mạng đồng minh",
                        "Hội Việt Nam độc lập đồng minh",
                        "Hội Việt Nam Cách mạng Thanh niên",
                    ],
                    c: 0,
                },
                {
                    id: 18,
                    q: "Việt Nam Quốc dân Đảng được thành lập vào thời gian nào?",
                    a: ["12/1927", "11/1926", "8/1925", "7/1925"],
                    c: 0,
                },
                {
                    id: 19,
                    q: "Ai là người đã tham gia sáng lập Việt Nam Quốc dân Đảng 1927 ?",
                    a: ["Tôn Quang Phiệt", "Trần Huy Liệu", "Phạm Tuấn Tài", "Nguyễn Thái Học"],
                    c: 3,
                },
                {
                    id: 20,
                    q: "Khởi nghĩa Yên Bái nổ ra vào thời gian nào?",
                    a: ["9-2-1930", "9-3-1930", "3-2-1930", "9-3-1931"],
                    c: 0,
                },
                {
                    id: 21,
                    q: "Tổ chức cộng sản nào ra đời đầu tiên ở Việt Nam?",
                    a: [
                        "Hội Việt Nam cách mạng thanh niên",
                        "Đông Dương cộng sản Đảng",
                        "An Nam cộng sản Đảng",
                        "Đông Dương cộng sản liên đoàn",
                    ],
                    c: 1,
                },
                {
                    id: 22,
                    q: "Chi bộ cộng sản đầu tiên ở Việt Nam được thành lập khi nào?",

                },
                {
                    id: 24,
                    q: "Đông Dương Cộng sản Đảng và An nam Cộng sản Đảng được ra đời từ tổ chức tiền thân nào?",

                {

                {

                {
                    id: 30,

            // Trạng thái vận hành của bài trắc nghiệm
            let activeQuestions = [];
            let currentIndex = 0;
            let userAnswers = {};
            let correctCount = 0;
            let wrongCount = 0;

            function initQuiz(fromQ = 1, toQ = 150, shuffleQ = false, shuffleA = false) {
                const min = Math.max(1, Math.min(fromQ, toQ));
                const max = Math.min(fullQuestions.length, Math.max(fromQ, toQ));

                let sliced = fullQuestions.slice(min - 1, max).map((item, originalSeq) => {
                    let opts = item.a.map((txt, idx) => ({
                        text: txt,
                        isCorrect: idx === item.c,
                    }));

                    if (shuffleA) {
                        opts = shuffle(opts);
                    }

                    return {
                        id: item.id,
                        question: item.q,
                        options: opts,
                    };
                });

                if (shuffleQ) {
                    sliced = shuffle(sliced);
                }

                activeQuestions = sliced;
                currentIndex = 0;
                userAnswers = {};
                correctCount = 0;
                wrongCount = 0;

                document.getElementById("quizTitle").innerText =
                    `Trắc nghiệm Lịch sử Đảng (${activeQuestions.length} câu)`;
                updateBadges();
                renderCurrentQuestion();
            }

            function shuffle(arr) {
                const cloned = [...arr];
                for (let i = cloned.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [cloned[i], cloned[j]] = [cloned[j], cloned[i]];
                }
                return cloned;
            }

            function renderCurrentQuestion() {
                if (!activeQuestions.length) return;

                const q = activeQuestions[currentIndex];
                const total = activeQuestions.length;
                const letters = ["A", "B", "C", "D"];

                // Cập nhật thanh tiến trình và thông tin câu
                const pct = ((currentIndex + 1) / total) * 100;
                document.getElementById("progressBar").style.width = `${pct}%`;
                document.getElementById("progressText").innerText = `${currentIndex + 1} / ${total}`;
                document.getElementById("questionIndexLabel").innerText = `CÂU HỎI ${currentIndex + 1}`;
                document.getElementById("questionContent").innerText = q.question;

                // Nút lui/tới
                document.getElementById("prevBtn").disabled = currentIndex === 0;
                document.getElementById("nextBtn").innerText = currentIndex === total - 1 ? "Hoàn thành" : "Tiếp tục";

                // Tạo các ô lựa chọn
                const container = document.getElementById("answersContainer");
                container.innerHTML = "";

                const chosenOptionIndex = userAnswers[currentIndex];
                const hasAnswered = chosenOptionIndex !== undefined;

                q.options.forEach((opt, idx) => {
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className =
                        "answer-btn w-full text-left p-4 rounded-2xl border border-slate-200 text-sm font-medium transition flex items-center gap-3 bg-white";

                    let labelColor = "text-slate-400";

                    if (hasAnswered) {
                        btn.disabled = true;
                        if (opt.isCorrect) {
                            // Đúng -> Xanh lá
                            btn.classList.add("correct-highlight");
                            labelColor = "text-green-600";
                        } else if (idx === chosenOptionIndex) {
                            // Đã chọn nhưng sai -> Đỏ
                            btn.classList.add("user-wrong");
                            labelColor = "text-red-600";
                        } else {
                            // Các câu không liên quan
                            btn.classList.add("other-options");
                        }
                    } else {
                        btn.onclick = () => selectOption(idx);
                    }

                    btn.innerHTML = `
          <span class="w-6 font-bold ${labelColor}">${letters[idx]}.</span>
          <span class="flex-1">${opt.text}</span>
        `;
                    container.appendChild(btn);
                });
            }

            function selectOption(optIndex) {
                if (userAnswers[currentIndex] !== undefined) return;

                userAnswers[currentIndex] = optIndex;
                const q = activeQuestions[currentIndex];
                const isRight = q.options[optIndex].isCorrect;

                if (isRight) {
                    correctCount++;
                } else {
                    wrongCount++;
                }

                updateBadges();
                renderCurrentQuestion();
            }

            function updateBadges() {
                document.getElementById("correctBadge").innerText = `✓ ${correctCount}`;
                document.getElementById("wrongBadge").innerText = `✕ ${wrongCount}`;
            }

            function nextQuestion() {
                if (currentIndex < activeQuestions.length - 1) {
                    currentIndex++;
                    renderCurrentQuestion();
                } else {
                    alert(`Bạn đã hoàn thành bài thi!\nSố câu đúng: ${correctCount} / ${activeQuestions.length}`);
                }
            }

            function prevQuestion() {
                if (currentIndex > 0) {
                    currentIndex--;
                    renderCurrentQuestion();
                }
            }

            function resetAndRestart() {
                const fromQ = parseInt(document.getElementById("inputFrom").value) || 1;
                const toQ = parseInt(document.getElementById("inputTo").value) || 150;
                const shuffleQ = document.getElementById("checkShuffleQ").checked;
                const shuffleA = document.getElementById("checkShuffleA").checked;
                initQuiz(fromQ, toQ, shuffleQ, shuffleA);
            }

            // Modal cấu hình
            function toggleConfigModal() {
                document.getElementById("configModal").showModal();
            }
            function closeConfigModal() {
                document.getElementById("configModal").close();
            }
            function applySettings() {
                resetAndRestart();
                closeConfigModal();
            }

            // Khởi tạo chạy mặc định khi trang tải xong
            window.onload = () => {
                initQuiz(1, 150, false, false);
            };
        </script>
